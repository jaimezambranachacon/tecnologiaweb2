<!DOCTYPE html>


<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPDS - Ingeniería Web II</title>
    
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="./content/inicio.js"></script>
    <script src="./content/normas.js"></script>
    <script src="./content/programa.js"></script>
    <script src="./content/proyecto.js"></script>
    <script src="./content/cronograma.js"></script>
    <script src="./content/texto_guia.js"></script>
    <script src="./content/presentaciones.js"></script>
    <script src="./content/bibliografia.js"></script>
    <script src="./content/videos.js"></script>
    <script src="./content/ingles.js"></script>


    
    <script src="./content/texto_base_u01.js"></script>
    <script src="./content/texto_base_u02.js"></script>
    <script src="./content/texto_base_u03.js"></script>
    <script src="./content/texto_base_u04.js"></script>
    <script src="./content/texto_base_u05.js"></script>
    <script src="./content/texto_base_u06.js"></script>
    <script src="./content/texto_base_u07.js"></script>
    <script src="./content/texto_base_u08.js"></script>
    <script src="./content/texto_base_u09.js"></script>
    <script src="./content/texto_base_u10.js"></script>
    

    <style>
        [v-cloak] { display: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #00aaff; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-900">

<div id="app" v-cloak class="flex min-h-screen relative">
    
    <aside class="w-72 bg-[#003366] text-white flex flex-col fixed inset-y-0 shadow-2xl z-50 transition-transform lg:translate-x-0 lg:static" :class="isMobile ? 'translate-x-0' : '-translate-x-full'">
        <div class="p-8 border-b border-white/10">
            <h1 class="text-xl font-black italic tracking-tighter uppercase text-[#00aaff]">Tecnologia Web II</h1>            
        </div>

        <nav class="flex-1 overflow-y-auto p-6 space-y-8 custom-scrollbar">
            <div v-for="section in menuStructure" :key="section.name">
                <h3 class="text-[10px] font-black uppercase text-[#00aaff] tracking-widest mb-4 opacity-70">{{ section.name }}</h3>
                <ul class="space-y-2">
                    <li v-for="link in section.links" :key="link.slug">
                        <button @click="navigate(link.slug)" 
                                :class="['w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-bold transition-all', currentSlug === link.slug ? 'bg-[#00aaff] text-white shadow-lg' : 'hover:bg-white/5 text-gray-400']">
                            <i :class="link.icon" class="w-5 text-center"></i>
                            {{ link.label }}
                        </button>
                    </li>
                </ul>
            </div>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden bg-white">
        <header class="h-16 border-b border-slate-100 flex items-center justify-between px-8 flex-none">
            <button @click="isMobile = !isMobile" class="lg:hidden text-[#003366]"><i class="fas fa-bars"></i></button>
            <div class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em]">DJ • 2026</div>
        </header>

        <div class="flex-1 overflow-y-auto p-8 lg:p-16 custom-scrollbar">
            <article class="max-w-4xl mx-auto">
                <div v-if="currentBody" v-html="currentBody" class="animate-in fade-in duration-700"></div>
                <div v-else class="text-center py-20 text-slate-300">
                    <i class="fas fa-file-circle-question text-6xl mb-4"></i>
                    <p class="font-bold">Selecciona un tema del menú</p>
                </div>
            </article>
        </div>
    </main>
</div>

[Image of a professional web documentation layout with a sidebar menu and main content area]

<script>
    const { createApp, ref, onMounted } = Vue;

    createApp({
        setup() {
            const isMobile = ref(false);
            const currentSlug = ref('inicio');
            const currentBody = ref('');

            // ESTRUCTURA DEL MENÚ: Solo editas esto para agregar temas
            const menuStructure = [
                { 
                    name: 'Introducción', 
                    links: [
                        { slug: 'inicio', label: 'Bienvenida', icon: 'fas fa-home', content: typeof pag_inicio !== 'undefined' ? pag_inicio : 'No cargo inicio.js' },
                        { slug: 'normas', label: 'Normas', icon: 'fas fa-gavel', content: typeof pag_normas !== 'undefined' ? pag_normas : 'No cargo normas.js' },
                        { slug: 'proyecto', label: 'Proyecto Formativo', icon: 'fas fa-project-diagram', content: typeof pag_proyecto !== 'undefined' ? pag_proyecto : 'No cargo proyecto.js' },
                    
                        { slug: 'presentaciones', label: 'Presentaciones', icon: 'fas fa-chalkboard-user', content: typeof pag_presentaciones !== 'undefined' ? pag_presentaciones : 'No cargo presentaciones.js' },
                        { slug: 'bibliografia', label: 'Bibliografía', icon: 'fas fa-book-open', content: typeof pag_bibliografia !== 'undefined' ? pag_bibliografia : 'No cargo bibliografia.js' },
                        { slug: 'videos', label: 'Videos', icon: 'fas fa-video', content: typeof pag_videos !== 'undefined' ? pag_videos : 'No cargo videos.js' },
                        { slug: 'ingles', label: 'Inglés DUOLINGO', icon: 'fas fa-globe', content: typeof pag_ingles !== 'undefined' ? pag_ingles : 'No cargo ingles.js' }

                    ]
                },
                { 
                    name: 'Contenido', 
                    links: [
                        { slug: 'texto_guia', label: 'Texto de Guía', icon: 'fas fa-book', content: typeof pag_texto_guia !== 'undefined' ? pag_texto_guia : 'No cargo texto_guia.js' },
                        { slug: 'pag_texto_base_u01', label: 'U1: HTML Semántico', icon: 'fab fa-html5', content: pag_texto_base_u01 },
                        { slug: 'pag_texto_base_u02', label: 'U2: Diseño CSS', icon: 'fab fa-css3-alt', content: pag_texto_base_u02 },
                        { slug: 'pag_texto_base_u03', label: 'U3: Lógica JS', icon: 'fab fa-js', content: pag_texto_base_u03 },                                                
                        { slug: 'pag_texto_base_u04', label: 'U4: PHP', icon: 'fab fa-js', content: pag_texto_base_u04 },                       

                        { slug: 'pag_texto_base_u05', label: 'U5: Bases de Datos', icon: 'fas fa-database', content: pag_texto_base_u05 },
                        
                        { slug: 'pag_texto_base_u06', label: 'U6: Frameworks', icon: 'fas fa-cubes', content: pag_texto_base_u06 },
                        /* 
                        { slug: 'pag_texto_base_u07', label: 'U7: Seguridad Web', icon: 'fas fa-shield-alt', content: pag_texto_base_u07 },
                        { slug: 'pag_texto_base_u08', label: 'U8: DevOps', icon: 'fas fa-server', content: pag_texto_base_u08 },
                        { slug: 'pag_texto_base_u09', label: 'U9: Accesibilidad', icon: 'fas fa-universal-access', content: pag_texto_base_u09 },
                        { slug: 'pag_texto_base_u10', label: 'U10: Tendencias', icon: 'fas fa-rocket', content: pag_texto_base_u10 }
                        */
                        

                            
                     
                    ]
                }
            ];




            const navigate = (slug) => {
                let found = null;
                menuStructure.forEach(section => {
                    const link = section.links.find(l => l.slug === slug);
                    if(link) found = link;
                });

                if(found) {
                    currentSlug.value = slug;
                    currentBody.value = found.content;
                    window.location.hash = slug;
                }
                isMobile.value = false;
            };

            onMounted(() => {
                const hash = window.location.hash.replace('#', '');
                navigate(hash || 'inicio');
            });

            return { isMobile, menuStructure, currentSlug, currentBody, navigate };
        }
    }).mount('#app');
</script>
</body>
</html>
